<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose Wisely</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff8f2;
        --muted: rgba(255, 248, 242, 0.72);
        --panel: rgba(15, 17, 28, 0.62);
        --border: rgba(255, 255, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 24% 28%, rgba(255, 216, 91, 0.28), transparent 26%),
          radial-gradient(circle at 74% 20%, rgba(72, 197, 255, 0.26), transparent 28%),
          linear-gradient(135deg, #111522 0%, #23132a 46%, #0d1f2a 100%);
        color: var(--ink);
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 28px;
        isolation: isolate;
      }

      .visual-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: radial-gradient(circle at center, black, transparent 72%);
        opacity: 0.55;
      }

      .choice-panel {
        width: min(520px, 100%);
        padding: clamp(28px, 6vw, 48px);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.38);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 4.35rem);
        line-height: 0.95;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p {
        margin: 18px auto 0;
        max-width: 34ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 30px;
      }

      button {
        min-height: 56px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        color: var(--ink);
        cursor: pointer;
        font: 800 0.95rem/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: transform 180ms ease, filter 180ms ease, border-color 180ms ease;
      }

      button:hover {
        border-color: rgba(255, 255, 255, 0.62);
        filter: brightness(1.08);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      .enter {
        background: linear-gradient(135deg, #ff2d55, #ffcc00, #32d74b, #0a84ff, #bf5af2);
      }

      .close {
        background: rgba(255, 255, 255, 0.09);
      }

      .reveal {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transform: scale(1.04);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .reveal::before {
        position: absolute;
        inset: -24%;
        content: "";
        background:
          conic-gradient(from 0deg, #ff004c, #ff8a00, #fff200, #00e676, #00b8ff, #7c4dff, #ff00b8, #ff004c);
        animation: spin 5s linear infinite;
      }

      .reveal::after {
        position: absolute;
        inset: 0;
        content: "";
        background:
          radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.22), transparent 28%),
          repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.12) 0 2px, transparent 2px 18px);
        mix-blend-mode: overlay;
      }

      .message {
        position: relative;
        z-index: 1;
        margin: 0;
        max-width: 12ch;
        color: #ffffff;
        font-size: clamp(3.4rem, 15vw, 10rem);
        font-weight: 1000;
        line-height: 0.86;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
        text-shadow:
          0 3px 0 #ff2d55,
          0 6px 0 #ff9f0a,
          0 9px 0 #30d158,
          0 12px 0 #0a84ff,
          0 18px 42px rgba(0, 0, 0, 0.38);
        animation: pop 900ms cubic-bezier(.17, .67, .26, 1.24) both, shimmer 2.2s ease-in-out infinite;
      }

      .closed {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #05070d;
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .closed h2 {
        margin: 0;
        color: rgba(255, 255, 255, 0.74);
        font-size: clamp(1.8rem, 8vw, 4.5rem);
        letter-spacing: 0;
        text-transform: uppercase;
      }

      body.entered .choice-panel,
      body.entered .visual-grid {
        opacity: 0;
        pointer-events: none;
      }

      body.entered .reveal {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }

      body.closed-site .choice-panel,
      body.closed-site .visual-grid,
      body.closed-site .reveal {
        opacity: 0;
        pointer-events: none;
      }

      body.closed-site .closed {
        opacity: 1;
        pointer-events: auto;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      @keyframes pop {
        0% {
          opacity: 0;
          transform: translateY(32px) scale(0.82) rotate(-4deg);
        }
        70% {
          transform: translateY(-8px) scale(1.04) rotate(1deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0deg);
        }
      }

      @keyframes shimmer {
        50% {
          filter: saturate(1.6) brightness(1.12);
          transform: translateY(-6px) rotate(0.6deg);
        }
      }

      @media (max-width: 520px) {
        .actions {
          grid-template-columns: 1fr;
        }

        button {
          min-height: 54px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="visual-grid" aria-hidden="true"></div>

      <section class="choice-panel" aria-labelledby="choice-title">
        <h1 id="choice-title">Enter?</h1>
        <p>Two buttons. One fate. Pick the door you can live with.</p>
        <div class="actions">
          <button class="enter" type="button" id="enterButton">Enter</button>
          <button class="close" type="button" id="closeButton">Close</button>
        </div>
      </section>

      <section class="reveal" aria-label="Rainbow reveal">
        <h2 class="message">YOU'RE GAY XD</h2>
      </section>

      <section class="closed" aria-label="Closed screen">
        <h2>Website Closed</h2>
      </section>
    </main>

    <script>
      const enterButton = document.querySelector("#enterButton");
      const closeButton = document.querySelector("#closeButton");

      enterButton.addEventListener("click", () => {
        document.body.classList.remove("closed-site");
        document.body.classList.add("entered");
      });

      closeButton.addEventListener("click", () => {
        window.close();
        window.setTimeout(() => {
          document.body.classList.add("closed-site");
        }, 120);
      });
    </script>
  </body>
</html>
